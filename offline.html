<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bug Forge AI — Offline</title>
<style>
  :root{--bg:#0a0d14;--s1:#111520;--b1:rgba(255,255,255,.07);--t1:#f1f5f9;--t2:#94a3b8;--t3:#64748b;--accent:#6366f1;--accent2:#818cf8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--t1);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:48px 40px;max-width:420px;width:100%;text-align:center}
  .icon{font-size:48px;margin-bottom:20px;display:block}
  h1{font-size:22px;font-weight:700;margin-bottom:10px;color:var(--t1)}
  p{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:24px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
  .btn:hover{opacity:.88}
  .hint{font-size:12px;color:var(--t3);margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <span class="icon">📡</span>
  <h1>You're offline</h1>
  <p>Bug Forge AI requires an internet connection to generate tickets and call AI providers.<br>Check your connection and try again.</p>
  <button class="btn" onclick="location.reload()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    Try again
  </button>
  <p class="hint">Your unsaved work may still be available when you reconnect.</p>
</div>
</body>
</html>
